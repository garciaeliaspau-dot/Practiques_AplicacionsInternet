<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXAR - Exercici HTML i CSS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, Helvetica, sans-serif;
            color: black;
        }

        /* CAPÇALERA */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 60px;
            background-color: white;
        }

        /* LOGO PIXAR */

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        /* MENÚ */

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            padding-bottom: 5px;
        }

        nav a:hover {
            color: gray;
        }

        nav a.actiu {
            border-bottom: 2px solid black;
        }

        /* IMATGE PRINCIPAL */

        .principal {
            width: 100%;
        }

        .principal img {
            width: 100%;
            height: 550px;
            object-fit: cover;
            display: block;
        }

        /* GALERIA */

        .galeria {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 60px;
        }

        /* CAIXES */

        .caixa {
            width: 30%;
            text-align: center;
            border: 1px solid #dddddd;
            padding: 10px;
            background-color: white;
        }

        .caixa img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .caixa img:hover {
            opacity: 0.7;
        }

        .caixa h2 {
            font-size: 16px;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        /* BOTONS */

        .boto {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 20px;
            background-color: black;
            color: white;
            text-decoration: none;
            font-size: 13px;
        }

        .boto:hover {
            background-color: gray;
        }

        /* PEU */

        footer {
            text-align: center;
            padding: 30px;
            color: gray;
            font-size: 13px;
        }

        /* VERSIÓ MÒBIL */

        @media screen and (max-width: 800px) {

            header {
                flex-direction: column;
                gap: 20px;
                padding: 25px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            .principal img {
                height: 350px;
            }

            .galeria {
                flex-direction: column;
                padding: 30px;
            }

            .caixa {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- CAPÇALERA -->

    <header>

        <div class="logo">
            PIXAR
        </div>

        <nav>
            <a href="#" class="actiu">INICI</a>
            <a href="#">PEL·LÍCULES</a>
            <a href="#">CURTMETRATGES</a>
            <a href="#">TECNOLOGIA</a>
            <a href="#">CARRERES</a>
        </nav>

    </header>


    <!-- IMATGE PRINCIPAL -->

    <section class="principal">

        <img
            src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1600&q=80"
            alt="Imatge principal">

    </section>


    <!-- TRES IMATGES INFERIORS -->

    <section class="galeria">

        <div class="caixa">

            <a href="#">
                <img
                    src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80"
                    alt="Pel·lícula 1">
            </a>

            <h2>FEATURE FILMS</h2>

            <a href="#" class="boto">VEURE MÉS</a>

        </div>


        <div class="caixa">

            <a href="#">
                <img
                    src="https://images.unsplash.com/photo-1481627834876-b7833e8f5570?auto=format&fit=crop&w=800&q=80"
                    alt="Pel·lícula 2">
            </a>

            <h2>SHORT FILMS</h2>

            <a href="#" class="boto">VEURE MÉS</a>

        </div>


        <div class="caixa">

            <a href="#">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                    alt="Pel·lícula 3">
            </a>

            <h2>TECHNOLOGY</h2>

            <a href="#" class="boto">VEURE MÉS</a>

        </div>

    </section>


    <!-- PEU DE PÀGINA -->

    <footer>

        <p>
            Programació d’Aplicacions a Internet
            <br>
            Grau en Gestió de Ciutats Intel·ligents i Sostenibles - UAB
        </p>

    </footer>

</body>

</html>
